<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learn Japanese with Anime Titles for FUN 😎</title>
  <link rel="icon" href="icon.png" type="image/png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" sizes="192x192" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700&family=Sawarabi+Mincho&display=swap" rel="stylesheet">
<style>
  /* --- ナビゲーションバー --- */
  nav { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(5px); padding: 0 5%; height: 70px; position: fixed; width: 100%; top: 0; left: 0; z-index: 1000; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 15px rgba(0,0,0,0.05); font-family: 'Noto Sans JP', sans-serif; box-sizing: border-box; }
  .logo { font-family: 'Sawarabi Mincho', serif; font-weight: bold; font-size: 1.2rem; white-space: nowrap; }
  .logo a { text-decoration: none; color: #2c3e50; }
  .nav-links { list-style: none; display: flex; gap: 1.2rem; margin: 0; padding: 0; }
  .nav-links a { text-decoration: none; color: #2c3e50; font-weight: 500; font-size: 0.8rem; letter-spacing: 1px; }
  @media (max-width: 600px) { nav { padding: 0 15px; } .logo { font-size: 1rem; } .nav-links { gap: 0.8rem; } .nav-links a { font-size: 0.7rem; } }

  /* --- メインレイアウト --- */
  body { font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif; background-color: #f0f4f8; color: #333; display: flex; justify-content: center; padding: 90px 20px 80px; }
  .main-wrapper { width: 100%; max-width: 900px; display: flex; flex-direction: column; align-items: center; }
  .slide-container { background-color: #ffffff; width: 100%; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); padding: 40px; box-sizing: border-box; position: relative; }
  h1 { text-align: center; color: #2c3e50; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 10px; }
  .instructions { text-align: center; color: #666; margin-bottom: 30px; font-size: 0.95em; }

  .topic-label { background-color: #e2e8f0; color: #4a5568; padding: 5px 10px; border-radius: 4px; font-size: 0.9em; display: inline-block; margin-bottom: 20px; font-weight: bold; border-left: 4px solid #8e44ad; }
  
  .slide { display: none; animation: fadeIn 0.4s; }
  .slide.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  /* --- フラッシュカードのグリッドレイアウト（少し幅広に設定） --- */
  .flashcard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; margin-bottom: 30px; }

  /* --- 3DフリップカードのCSS --- */
  .flashcard { background-color: transparent; width: 100%; height: 180px; perspective: 1000px; cursor: pointer; }
  .flashcard-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s; transform-style: preserve-3d; }
  .flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }
  .flashcard-front, .flashcard-back { position: absolute; width: 100%; height: 100%; -webkit-backface-visibility: hidden; backface-visibility: hidden; border-radius: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 4px 8px rgba(0,0,0,0.1); padding: 15px; box-sizing: border-box; }
  
  /* 表面（英語タイトル） */
  .flashcard-front { background-color: #fff; border: 2px solid #8e44ad; } 
  .flashcard-front .emoji { font-size: 2.5rem; margin-bottom: 10px; }
  .flashcard-front .eng-title { font-size: 1.2rem; font-weight: bold; color: #2c3e50; line-height: 1.3; }
  
  /* 裏面（日本語・解説） */
  .flashcard-back { background-color: #8e44ad; color: white; transform: rotateY(180deg); }
  .flashcard-back .jp-title { font-size: 1.3rem; font-weight: bold; margin-bottom: 5px; line-height: 1.2; }
  .flashcard-back .romaji { font-size: 0.9rem; font-style: italic; margin-bottom: 10px; opacity: 0.9; }
  .flashcard-back .meaning { font-size: 0.85rem; line-height: 1.4; background: rgba(0,0,0,0.15); padding: 8px; border-radius: 8px; width: 100%; text-align: left; }

  /* ナビゲーションボタン */
  .nav-controls { display: flex; justify-content: space-between; margin-top: 30px; padding-top: 20px; border-top: 2px solid #e2e8f0; }
  .nav-btn { background-color: #2c3e50; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-size: 1em; font-weight: bold; cursor: pointer; transition: background-color 0.2s; }
  .nav-btn:hover { background-color: #1a252f; }
  .nav-btn:disabled { background-color: #a0aec0; cursor: not-allowed; }
  .slide-indicator { font-size: 0.9em; color: #718096; align-self: center; font-weight: bold; }
  
  /* --- Support Section --- */
  .support-section { text-align: center; margin-top: 50px; padding-top: 30px; border-top: 2px solid #e2e8f0; width: 100%; }
  .support-section h2 { color: #2c3e50; font-size: 1.2em; margin-bottom: 10px; }
  .support-section p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .bmc-custom-btn { display: inline-flex; align-items: center; justify-content: center; background-color: #FFDD00; color: #000; padding: 12px 24px; border-radius: 8px; font-weight: bold; font-size: 1.1em; text-decoration: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: transform 0.2s, box-shadow 0.2s; }
  .bmc-custom-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,0.15); }
  .bmc-custom-btn span { margin-left: 8px; letter-spacing: 0.5px; }

  @media (max-width: 600px) { 
      .slide-container { padding: 30px 15px 50px; } 
      .flashcard-grid { grid-template-columns: 1fr; gap: 15px;}
      .flashcard { height: 160px; }
      .flashcard-front .emoji { font-size: 2rem; }
      .flashcard-front .eng-title { font-size: 1.1rem; }
      .flashcard-back .jp-title { font-size: 1.1rem; }
      .flashcard-back .meaning { font-size: 0.8rem; }
  }
</style>
</head>
<body>

<nav>
    <div class="logo"><a href="https://ohayocenter.com/">OHAYO CENTER</a></div>
    <ul class="nav-links">
        <li><a href="https://ohayocenter.com/#lessons">LESSONS</a></li>
        <li><a href="https://ohayocenter.com/#profile">PROFILE</a></li>
        <li><a href="https://ohayocenter.com/#resources">MATERIAL</a></li>
    </ul>
</nav>

<div class="main-wrapper">
  <div class="slide-container">
    <h1>Learn Japanese with Anime Titles for FUN 😎</h1>
    <p class="instructions">Click on the English title to reveal the true Japanese meaning!</p>
    
    <div id="quiz-container"></div>

    <div class="nav-controls">
      <button id="prevBtn" class="nav-btn" onclick="changeSlide(-1)" disabled>← PREV</button>
      <div id="slideIndicator" class="slide-indicator">Slide 1 of 2</div>
      <button id="nextBtn" class="nav-btn" onclick="changeSlide(1)">NEXT →</button>
    </div>

    <div class="support-section">
      <h2>Support OHAYO CENTER</h2>
      <p>If you find these materials helpful, please consider supporting us!</p>
      <a class="bmc-custom-btn" href="https://www.buymeacoffee.com/ohayocenteh" target="_blank">
        ☕️ <span>SUPPORT OHAYO CENTER</span>
      </a>
    </div>
  </div>
</div>

<script>
  // アニメタイトルの学習データ
  const wordData = [
    // Slide 1 (1-10)
    {
      title: "Popular Anime 1-10",
      words: [
        { e: "Jujutsu Kaisen", j: "呪術廻戦", r: "Jujutsu Kaisen", m: "<b>Jujutsu:</b> Sorcery / Magic<br><b>Kaisen:</b> Endless Battle", em: "🤞", audio: "anime-audio/jujutsu-kaisen.mp3" },
        { e: "Frieren: Beyond Journey's End", j: "葬送のフリーレン", r: "Sōsō no Frieren", m: "<b>Sōsō:</b> Sending off / Funeral. The English title is a beautiful translation.", em: "🧝‍♀️", audio: "anime-audio/soso-no-frieren.mp3" },
        { e: "One-Punch Man", j: "ワンパンマン", r: "Wanpanman", m: "<b>Wanpan:</b> Abbreviation of 'One Punch' in Katakana.", em: "👊", audio: "anime-audio/wanpanman.mp3" },
        { e: "Demon Slayer", j: "鬼滅の刃", r: "Kimetsu no Yaiba", m: "<b>Oni:</b> Demon<br><b>Metsu:</b> Destroy / Slayer<br><b>Yaiba:</b> Blade", em: "🗡️", audio: "anime-audio/kimetsu-no-yaiba.mp3" },
        { e: "Attack on Titan", j: "進撃の巨人", r: "Shingeki no Kyojin", m: "<b>Kyojin:</b> Titan / Giant<br><b>Shingeki:</b> Advance / Attack", em: "🧱", audio: "anime-audio/shingeki-no-kyojin.mp3" },
        { e: "Spirited Away", j: "千と千尋の神隠し", r: "Sen to Chihiro no Kamikakushi", m: "<b>Kamikakushi:</b> Hidden by Gods. A traditional Japanese belief.", em: "🐉", audio: "anime-audio/sen-to-chihiro-no-kamikakushi.mp3" },
        { e: "The Apothecary Diaries", j: "薬屋のひとりごと", r: "Kusuriya no Hitorigoto", m: "<b>Kusuriya:</b> Pharmacy<br><b>Hitorigoto:</b> Talking to oneself", em: "🌿", audio: "anime-audio/kusuriya-no-hitorigoto.mp3" },
        { e: "Chainsaw Man", j: "チェンソーマン", r: "Chensōman", m: "A great way to practice Katakana! Also learn words like <b>Akuma</b> (Devil).", em: "🪚", audio: "anime-audio/chensoman.mp3" },
        { e: "Fullmetal Alchemist", j: "鋼の錬金術師", r: "Hagane no Renkinjutsushi", m: "<b>Hagane:</b> Steel / Fullmetal<br><b>Renkinjutsushi:</b> Alchemist", em: "⚙️", audio: "anime-audio/hagane-no-renkinjutsushi.mp3" },
        { e: "That Time I Got Reincarnated as a Slime", j: "転生したらスライムだった件", r: "Tensei shitara Slime datta ken", m: "<b>Tensei:</b> Reincarnation<br><b>〜ken:</b> The matter of...", em: "💧", audio: "anime-audio/tensei-shitara-slime-datta-ken.mp3" }
      ]
    },
    // Slide 2 (11-20)
    {
      title: "Popular Anime 11-20",
      words: [
        { e: "A Silent Voice", j: "聲の形", r: "Koe no Katachi", m: "<b>Koe (聲):</b> Old kanji for Voice<br><b>Katachi:</b> Shape. Lit: The Shape of Voice.", em: "🤟", audio: "anime-audio/koe-no-katachi.mp3" },
        { e: "My Hero Academia", j: "僕のヒーローアカデミア", r: "Boku no Hīrō Akademia", m: "<b>Boku:</b> 'I' or 'Me' (Used mostly by males, sounds humble and young).", em: "🦸‍♂️", audio: "anime-audio/boku-no-hiro-akademia.mp3" },
        { e: "Mushoku Tensei: Jobless Reincarnation", j: "無職転生", r: "Mushoku Tensei", m: "<b>Mu:</b> No/Zero + <b>Shoku:</b> Job = <b>Mushoku:</b> Jobless/Unemployed.", em: "🪄", audio: "anime-audio/mushoku-tensei.mp3" },
        { e: "Re:ZERO -Starting Life in Another World-", j: "Re:ゼロから始める異世界生活", r: "Re:Zero kara Hajimeru Isekai Seikatsu", m: "<b>Isekai:</b> Another world<br><b>Seikatsu:</b> Life", em: "🔄", audio: "anime-audio/re-zero-kara-hajimeru-isekai-seikatsu.mp3" },
        { e: "Assassination Classroom", j: "暗殺教室", r: "Ansatsu Kyōshitsu", m: "<b>Ansatsu:</b> Assassination<br><b>Kyōshitsu:</b> Classroom", em: "🐙", audio: "anime-audio/ansatsu-kyoshitsu.mp3" },
        { e: "Haikyu!!", j: "ハイキュー!!", r: "Haikyū!!", m: "<b>Haikyuu (排球):</b> The Japanese word/kanji for Volleyball.", em: "🏐", audio: "anime-audio/haikyu.mp3" },
        { e: "Gintama", j: "銀魂", r: "Gintama", m: "<b>Gin:</b> Silver<br><b>Tama (Tamashii):</b> Soul. Lit: Silver Soul.", em: "🍡", audio: "anime-audio/gintama.mp3" },
        { e: "Oshi no Ko", j: "推しの子", r: "Oshi no Ko", m: "<b>Oshi:</b> Favorite character / Bias. A very common word in modern pop culture!", em: "🌟", audio: "anime-audio/oshi-no-ko.mp3" },
        { e: "Weathering with You", j: "天気の子", r: "Tenki no Ko", m: "<b>Tenki:</b> Weather<br><b>Ko:</b> Child. 'Weathering' is a great English localization.", em: "☀️", audio: "anime-audio/tenki-no-ko.mp3" },
        { e: "Your Name.", j: "君の名は。", r: "Kimi no Na wa.", m: "<b>Kimi:</b> You<br><b>Na:</b> Name. A very poetic and beautiful way to ask 'What is your name?'.", em: "☄️", audio: "anime-audio/kimi-no-na-wa.mp3" }
      ]
    }
  ];

  const totalSlides = wordData.length;
  let currentSlide = 1;

  function initApp() {
    const container = document.getElementById('quiz-container');
    
    wordData.forEach((data, index) => {
      const slideNum = index + 1;
      const isActive = slideNum === 1 ? 'active' : '';
      
      let cardsHtml = '';
      data.words.forEach(word => {
        cardsHtml += `
          <div class="flashcard" onclick="flipAndSpeak(this, '${word.audio}')">
            <div class="flashcard-inner">
              <div class="flashcard-front">
                <div class="emoji">${word.em}</div>
                <div class="eng-title">${word.e}</div>
              </div>
              <div class="flashcard-back">
                <div class="jp-title">${word.j}</div>
                <div class="romaji">${word.r}</div>
                <div class="meaning">${word.m}</div>
              </div>
            </div>
          </div>
        `;
      });

      const slideHtml = `
        <div id="slide${slideNum}" class="slide ${isActive}">
          <div class="topic-label">${data.title}</div>
          <div class="flashcard-grid">
            ${cardsHtml}
          </div>
        </div>
      `;
      container.innerHTML += slideHtml;
    });
  }

  // ★自動音声はオフ。audioFileが設定された時のみ再生される仕様★
  function flipAndSpeak(cardElement, audioFile) {
    cardElement.classList.toggle('flipped');

    // 表面から裏面になった時だけチェック
    if(cardElement.classList.contains('flipped')) {
        // audioFile（例: "jujutsu.mp3"）が入力されている場合のみ再生
        if (audioFile && audioFile !== "") {
            const audio = new Audio(audioFile);
            audio.play();
        }
    }
  }

  function changeSlide(direction) {
    document.getElementById('slide' + currentSlide).classList.remove('active');
    currentSlide += direction;
    document.getElementById('slide' + currentSlide).classList.add('active');
    
    document.getElementById('prevBtn').disabled = (currentSlide === 1);
    document.getElementById('nextBtn').disabled = (currentSlide === totalSlides);
    
    document.getElementById('slideIndicator').innerText = `Slide ${currentSlide} of ${totalSlides}`;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  window.onload = initApp;

</script>

</body>

</html>
