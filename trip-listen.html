    <style>
        /* --- 基本設定（OHAYO CENTER共通） --- */
        :root { --primary: #ff9f43; --primary-light: #fff5eb; --dark: #2c3e50; --text: #444; --shadow: 0 10px 30px rgba(0,0,0,0.06); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Noto Sans JP', sans-serif; color: var(--text); background-color: #f9f9f9; line-height: 1.8; }

        nav { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(5px); padding: 0 5%; height: 70px; position: fixed; width: 100%; top: 0; left: 0; z-index: 1000; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 15px rgba(0,0,0,0.05); }
        .logo { font-family: 'Sawarabi Mincho', serif; font-weight: bold; color: var(--dark); font-size: 1.2rem; white-space: nowrap; }
        .logo a { text-decoration: none; color: inherit; }
        .nav-links { list-style: none; display: flex; gap: 1.2rem; }
        .nav-links a { text-decoration: none; color: var(--dark); font-weight: 500; font-size: 0.8rem; letter-spacing: 1px; }

        .container { max-width: 850px; margin: 0 auto; padding: 120px 1.2rem 3rem; }
        h2 { font-family: 'Sawarabi Mincho', serif; text-align: center; font-size: 1.8rem; margin-bottom: 0.5rem; color: var(--dark); }
        .intro-text { text-align: center; color: #777; margin-bottom: 1.2rem; font-size: 0.95rem; }

        /* --- 言語切替 --- */
        .lang-switcher { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 2rem; }
        .lang-btn { padding: 8px 18px; border: 2px solid #eee; background: #fff; border-radius: 30px; font-size: 0.9rem; font-weight: bold; color: var(--dark); cursor: pointer; transition: 0.2s; font-family: inherit; }
        .lang-btn:hover { border-color: var(--primary); }
        .lang-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }

        .quest-card { background: #fff; border-radius: 20px; box-shadow: var(--shadow); padding: 30px; border: 1px solid rgba(0,0,0,0.02); min-height: 400px; }
        .menu-heading { font-family: 'Sawarabi Mincho', serif; font-size: 1.3rem; color: var(--dark); text-align: center; margin-bottom: 20px; }

        /* --- クエスト選択メニュー --- */
        #quest-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; animation: fadeIn 0.5s; }
        .stage-btn { display: flex; flex-wrap: wrap; align-items: center; padding: 20px; background: #fff; border: 2px solid #eee; border-radius: 15px; cursor: pointer; transition: 0.2s; text-align: left; font-family: inherit; width: 100%; }
        .stage-btn:hover { border-color: var(--primary); background: var(--primary-light); transform: translateY(-3px); box-shadow: 0 5px 15px rgba(255,159,67,0.15); }
        .stage-btn.done { border-color: #a9dfbf; }
        .stage-icon { font-size: 2rem; color: var(--primary); width: 60px; text-align: center; flex-shrink: 0; }
        .stage-info { flex: 1; }
        .stage-title { font-size: 1.1rem; font-weight: bold; color: var(--dark); font-family: 'Sawarabi Mincho', serif; margin-bottom: 3px; }
        .stage-desc { font-size: 0.8rem; color: #777; line-height: 1.4; }
        .done-badge { color: #27ae60; font-weight: bold; font-size: 0.8rem; white-space: nowrap; margin-left: 8px; }
        .stage-img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 10px; display: block; margin-bottom: 14px; background: var(--primary-light); }

        /* --- プレイ画面 --- */
        #play-area { display: none; animation: fadeIn 0.3s; max-width: 600px; margin: 0 auto; }
        .quest-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .back-btn { background: none; border: none; color: #888; cursor: pointer; font-size: 1rem; transition: 0.2s; font-family: inherit; }
        .back-btn:hover { color: var(--primary); }
        .quest-title-play { font-weight: bold; color: var(--dark); font-family: 'Sawarabi Mincho', serif; }
        .progress-text { font-size: 0.85rem; color: #aaa; font-weight: bold; white-space: nowrap; margin-left: 10px; }

        .scene-img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 15px; display: block; margin-bottom: 20px; background: var(--primary-light); }
        .context-box { background: var(--primary-light); border-left: 4px solid var(--primary); border-radius: 10px; padding: 14px 18px; margin-bottom: 25px; font-size: 0.98rem; color: var(--dark); display: flex; gap: 10px; align-items: flex-start; }
        .context-box i { color: var(--primary); margin-top: 6px; }

        .listen-area { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 25px; }
        .play-big { width: 92px; height: 92px; border-radius: 50%; border: none; background: var(--primary); color: #fff; font-size: 2.2rem; cursor: pointer; transition: 0.2s; box-shadow: 0 8px 20px rgba(255,159,67,0.35); display: flex; justify-content: center; align-items: center; }
        .play-big:hover { transform: scale(1.06); }
        .play-big:active { transform: scale(0.97); }
        .listen-label { font-weight: bold; color: var(--dark); font-size: 1.05rem; }
        .speed-row { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #888; }
        .speed-btn { padding: 4px 14px; border: 2px solid #eee; background: #fff; border-radius: 20px; font-size: 0.85rem; font-weight: bold; color: var(--dark); cursor: pointer; transition: 0.2s; font-family: inherit; }
        .speed-btn.active { background: var(--dark); border-color: var(--dark); color: #fff; }

        .what-label { font-weight: bold; color: var(--dark); margin-bottom: 12px; font-size: 1rem; }

        /* 選択肢ボタン */
        .choices-area { display: flex; flex-direction: column; gap: 12px; }
        .choice-btn { padding: 14px 16px; border: 2px solid #eee; background: #fff; border-radius: 12px; cursor: pointer; transition: 0.2s; color: var(--dark); text-align: left; display: flex; flex-direction: column; gap: 2px; font-family: inherit; width: 100%; }
        .choice-btn:hover:not(:disabled) { border-color: var(--primary); background: var(--primary-light); }
        .choice-btn:disabled { cursor: default; }
        .choice-romaji { font-size: 1.05rem; font-weight: bold; color: var(--dark); line-height: 1.5; }
        .choice-tr { font-size: 0.88rem; color: #777; line-height: 1.5; }
        .choice-btn.correct-choice { border-color: #2ecc71; background: #eafaf1; }
        .choice-btn.wrong-choice { border-color: #e74c3c; background: #fdecea; opacity: 0.6; }

        /* フィードバックメッセージ */
        .feedback { text-align: center; margin: 18px 0 8px; font-weight: bold; min-height: 1.5rem; font-size: 0.98rem; }
        .feedback.correct { color: #2ecc71; }
        .feedback.wrong { color: #e74c3c; }

        /* 聞いた文の開示パネル */
        #heard-panel { display: none; background: var(--primary-light); border-radius: 15px; padding: 18px 20px; margin-top: 12px; animation: fadeIn 0.4s; }
        .heard-label { font-size: 0.8rem; font-weight: bold; color: var(--primary); letter-spacing: 1px; margin-bottom: 6px; }
        .jp-text { font-size: 1.3rem; font-weight: bold; color: var(--dark); font-family: 'Sawarabi Mincho', serif; margin-bottom: 4px; line-height: 1.6; }
        .romaji-text { color: #666; font-size: 0.95rem; }

        .next-row { text-align: center; margin-top: 22px; }
        #next-btn { display: none; }

        /* 最終画面用 */
        #result-area { display: none; text-align: center; animation: fadeIn 0.5s; max-width: 600px; margin: 0 auto; }
        .result-img { width: 100%; max-width: 360px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 15px; display: block; margin: 0 auto 18px; background: var(--primary-light); }
        .result-title { font-size: 1.8rem; color: var(--primary); font-family: 'Sawarabi Mincho', serif; margin-bottom: 6px; font-weight: bold; }
        .result-score { font-size: 1.1rem; font-weight: bold; color: var(--dark); margin-bottom: 10px; }
        .survival-list { background: var(--primary-light); padding: 25px; border-radius: 15px; text-align: left; margin-top: 25px; }
        .survival-list h3 { font-size: 1.1rem; color: var(--dark); margin-bottom: 15px; border-bottom: 2px solid #fff; padding-bottom: 10px; }
        .survival-item { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 16px; }
        .survival-item:last-child { margin-bottom: 0; }
        .mini-play { width: 42px; height: 42px; border-radius: 50%; border: none; background: var(--primary); color: #fff; font-size: 0.95rem; cursor: pointer; flex-shrink: 0; transition: 0.2s; display: flex; justify-content: center; align-items: center; margin-top: 2px; }
        .mini-play:hover { transform: scale(1.08); }
        .survival-body { flex: 1; }
        .survival-body b { color: var(--dark); font-size: 1.05rem; display: block; line-height: 1.5; }
        .survival-body .survival-tr { color: #666; font-size: 0.9rem; display: block; line-height: 1.5; }
        .survival-jp { font-family: 'Sawarabi Mincho', serif; font-size: 1.15rem; font-weight: bold; color: var(--dark); margin-top: 4px; line-height: 1.6; }
        .show-jp-btn { background: none; border: none; color: var(--primary); font-size: 0.8rem; font-weight: bold; cursor: pointer; padding: 2px 0; text-decoration: underline; font-family: inherit; }

        .action-btns { display: flex; gap: 10px; justify-content: center; margin-top: 25px; }
        .restart-btn { background: var(--primary); color: #fff; border: none; padding: 12px 25px; border-radius: 30px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.3s; flex: 1; max-width: 220px; font-family: inherit; }
        .restart-btn:hover { opacity: 0.9; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(255, 159, 67, 0.3); }
        .map-btn { background: #eee; color: var(--dark); border: none; padding: 12px 25px; border-radius: 30px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.3s; flex: 1; max-width: 220px; font-family: inherit; }
        .map-btn:hover { background: #ddd; transform: translateY(-2px); }

        footer { padding: 3rem; text-align: center; font-size: 0.75rem; color: #aaa; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* スマホ対応（タッチターゲット44px以上・横スクロール防止・文字サイズ確保） */
        @media (max-width: 768px) {
            button { touch-action: manipulation; }

            /* クエストメニュー: 1カラムに積み上げ（カード全体がタップ領域） */
            #quest-menu { grid-template-columns: 1fr; }
            .stage-btn { padding: 16px; }
            .stage-desc { font-size: 0.88rem; }

            /* 言語切替・速度切替: 44px以上のタップ領域（言語は折り返し可） */
            .lang-btn { min-height: 44px; display: inline-flex; align-items: center; justify-content: center; }
            .speed-btn { min-height: 44px; padding: 4px 18px; display: inline-flex; align-items: center; }

            /* 場面バナー: 低くして再生ボタンと選択肢に早く届くように */
            .scene-img { aspect-ratio: 21 / 9; }

            /* 場面ヘッダー: 折り返し可にしてはみ出し防止、戻るボタンのタップ領域拡大 */
            .quest-header { flex-wrap: wrap; gap: 6px 10px; }
            .quest-title-play { min-width: 0; }
            .back-btn { padding: 12px 10px 12px 0; white-space: nowrap; }

            /* 本文・選択肢・フィードバックの文字サイズと選択肢の高さ */
            .context-box { font-size: 1rem; }
            .choice-btn { min-height: 56px; padding: 14px 16px; justify-content: center; }
            .choice-romaji { font-size: 1.1rem; }
            .choice-tr { font-size: 1rem; }
            .feedback { font-size: 1rem; }

            /* 結果画面: 再生ボタン44px、日本語トグルのタップ領域拡大、本文のはみ出し防止 */
            .mini-play { width: 44px; height: 44px; }
            .survival-body { min-width: 0; }
            .show-jp-btn { font-size: 0.85rem; padding: 10px 8px 10px 0; }
        }
        @media (max-width: 480px) {
            nav { padding: 0 4%; }
            .logo { font-size: 1rem; }
            .nav-links { gap: 0.8rem; }
            .nav-links a { font-size: 0.7rem; letter-spacing: 0.5px; }
            .container { padding: 120px 0.8rem 3rem; }
            h2 { font-size: 1.45rem; }
            .quest-card { padding: 20px 15px; }
            .jp-text { font-size: 1.1rem; }
            .survival-list { padding: 18px 15px; }
            .action-btns { flex-direction: column; align-items: center; }
            .restart-btn, .map-btn { width: 100%; max-width: none; }
        }
    </style>
</head>

const LANG_NAMES = { en: "English", pt: "Português", it: "Italiano", es: "Español" };
let lang = "en";
try {
    const savedLang = localStorage.getItem("ohayo_listen_lang");
    if (savedLang && DATA.ui[savedLang]) lang = savedLang;
} catch (e) {}
let progress = {};
try {
    progress = JSON.parse(localStorage.getItem("ohayo_listen_progress") || "{}") || {};
} catch (e) { progress = {}; }

let screen = "menu";
let cur = -1;
let scene = 0;
let firstTry = [true, true, true, true, true];
let answered = false;
let speed = 1.0;
const player = new Audio();

function el(id) { return document.getElementById(id); }
function t(key) { return DATA.ui[lang][key]; }
function fmt(str, a, b) { return String(str).replace("{n}", a).replace("{a}", a).replace("{b}", b); }
function saveLang() { try { localStorage.setItem("ohayo_listen_lang", lang); } catch (e) {} }
function saveProgress() { try { localStorage.setItem("ohayo_listen_progress", JSON.stringify(progress)); } catch (e) {} }

function playAudio(path) {
    player.src = path;
    player.playbackRate = speed;
    const p = player.play();
    if (p && typeof p.catch === "function") p.catch(function () {});
}

function shuffled(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
}

function setSpeed(v) {
    speed = v;
    player.playbackRate = v;
    el("speed-10").classList.toggle("active", v === 1.0);
    el("speed-08").classList.toggle("active", v === 0.8);
}

function buildLangSwitcher() {
    const box = el("lang-switcher");
    box.innerHTML = "";
    Object.keys(LANG_NAMES).forEach(function (code) {
        const btn = document.createElement("button");
        btn.className = "lang-btn" + (code === lang ? " active" : "");
        btn.textContent = LANG_NAMES[code];
        btn.onclick = function () { setLang(code); };
        box.appendChild(btn);
    });
}

function applyTexts() {
    el("page-title-text").textContent = t("pageTitle");
    el("intro-text").textContent = t("intro");
    el("menu-heading").textContent = t("chooseQuest");
    el("pq-back").textContent = "← " + t("back");
    el("listen-label").textContent = t("listenBtn");
    el("speed-label").textContent = t("speed") + ":";
    el("what-label").textContent = t("whatDoYouSay");
    el("heard-label").textContent = t("youHeard");
    el("btn-to-menu").textContent = t("back");
    el("btn-replay").textContent = t("playAgain");
    el("survival-title").textContent = t("survivalTitle");
    document.title = t("pageTitle") + " | OHAYO CENTER";
}

function setLang(code) {
    if (!DATA.ui[code]) return;
    lang = code;
    saveLang();
    buildLangSwitcher();
    applyTexts();
    if (screen === "menu") renderMenu();
    else if (screen === "play") renderScene(true);
    else if (screen === "result") showResult();
}

function showScreen(name) {
    el("menu-area").style.display = name === "menu" ? "block" : "none";
    el("play-area").style.display = name === "play" ? "block" : "none";
    el("result-area").style.display = name === "result" ? "block" : "none";
}

function renderMenu() {
    screen = "menu";
    showScreen("menu");
    const menu = el("quest-menu");
    menu.innerHTML = "";
    DATA.quests.forEach(function (q, qi) {
        const btn = document.createElement("button");
        btn.className = "stage-btn" + (progress[q.id] ? " done" : "");
        const img = document.createElement("img");
        img.className = "stage-img";
        img.src = "trip-img/" + q.id + ".webp";
        img.alt = q.title.en;
        img.loading = "lazy";
        btn.appendChild(img);
        const icon = document.createElement("span");
        icon.className = "stage-icon";
        icon.innerHTML = '<i class="fa-solid ' + q.icon + '"></i>';
        const info = document.createElement("div");
        info.className = "stage-info";
        const title = document.createElement("div");
        title.className = "stage-title";
        title.textContent = q.title[lang];
        const desc = document.createElement("div");
        desc.className = "stage-desc";
        desc.textContent = fmt(t("scenesCount"), q.scenes.length);
        info.appendChild(title);
        info.appendChild(desc);
        btn.appendChild(icon);
        btn.appendChild(info);
        if (progress[q.id]) {
            const badge = document.createElement("span");
            badge.className = "done-badge";
            badge.textContent = "✓ " + t("completed");
            btn.appendChild(badge);
        }
        btn.onclick = function () { startQuest(qi); };
        menu.appendChild(btn);
    });
}

function startQuest(qi) {
    cur = qi;
    scene = 0;
    firstTry = DATA.quests[qi].scenes.map(function () { return true; });
    answered = false;
    screen = "play";
    renderScene(false);
}

function renderScene(keepAnswered) {
    const q = DATA.quests[cur];
    const s = q.scenes[scene];
    showScreen("play");
    el("pq-title").textContent = q.title[lang];
    el("pq-progress").textContent = fmt(t("sceneOf"), scene + 1, q.scenes.length);
    el("context-text").textContent = s.context[lang];
    el("scene-img").src = "trip-img/" + q.id + ".webp";
    el("scene-img").alt = q.title.en;
    el("play-btn").onclick = function () { playAudio(s.audio); };

    const area = el("choices-area");
    area.innerHTML = "";
    shuffled(s.choices).forEach(function (c) {
        const btn = document.createElement("button");
        btn.className = "choice-btn";
        btn.choiceData = c;
        const r = document.createElement("span");
        r.className = "choice-romaji";
        r.textContent = c.romaji;
        const tr = document.createElement("span");
        tr.className = "choice-tr";
        tr.textContent = c.tr[lang];
        btn.appendChild(r);
        btn.appendChild(tr);
        btn.onclick = function () { choose(c, btn); };
        area.appendChild(btn);
    });

    const fb = el("feedback-msg");
    fb.textContent = "";
    fb.className = "feedback";
    el("heard-panel").style.display = "none";
    el("next-btn").style.display = "none";

    if (keepAnswered && answered) applyAnsweredState();
}

function applyAnsweredState() {
    const q = DATA.quests[cur];
    const s = q.scenes[scene];
    const fb = el("feedback-msg");
    fb.className = "feedback correct";
    s.choices.forEach(function (c) { if (c.correct) fb.textContent = c.feedback[lang]; });
    const area = el("choices-area");
    for (let i = 0; i < area.children.length; i++) {
        const child = area.children[i];
        child.disabled = true;
        if (child.choiceData && child.choiceData.correct) child.classList.add("correct-choice");
    }
    el("heard-jp").textContent = s.clerkJp;
    el("heard-romaji").textContent = s.clerkRomaji;
    el("heard-panel").style.display = "block";
    const nb = el("next-btn");
    nb.textContent = scene === q.scenes.length - 1 ? t("finish") : t("next");
    nb.style.display = "inline-block";
}

function choose(choice, btn) {
    if (answered) return;
    const q = DATA.quests[cur];
    const s = q.scenes[scene];
    const fb = el("feedback-msg");
    if (choice.correct) {
        answered = true;
        fb.className = "feedback correct";
        fb.textContent = choice.feedback[lang];
        const area = el("choices-area");
        for (let i = 0; i < area.children.length; i++) {
            const child = area.children[i];
            child.disabled = true;
            if (child.choiceData && child.choiceData.correct) child.classList.add("correct-choice");
        }
        el("heard-jp").textContent = s.clerkJp;
        el("heard-romaji").textContent = s.clerkRomaji;
        el("heard-panel").style.display = "block";
        const nb = el("next-btn");
        nb.textContent = scene === q.scenes.length - 1 ? t("finish") : t("next");
        nb.style.display = "inline-block";
    } else {
        firstTry[scene] = false;
        fb.className = "feedback wrong";
        fb.textContent = choice.feedback[lang];
        btn.disabled = true;
        btn.classList.add("wrong-choice");
    }
}

function nextScene() {
    scene++;
    if (scene >= DATA.quests[cur].scenes.length) {
        showResult();
    } else {
        answered = false;
        renderScene(false);
    }
}

function showResult() {
    screen = "result";
    showScreen("result");
    const q = DATA.quests[cur];
    progress[q.id] = true;
    saveProgress();
    el("result-title").textContent = "🎉 " + t("questComplete");
    el("result-img").src = "trip-img/" + q.id + ".webp";
    el("result-img").alt = q.title.en;
    const score = firstTry.filter(Boolean).length;
    el("result-score").textContent = fmt(t("firstTry"), score, q.scenes.length);

    const list = el("summary-list");
    list.innerHTML = "";
    q.summary.forEach(function (item) {
        const row = document.createElement("div");
        row.className = "survival-item";
        const play = document.createElement("button");
        play.className = "mini-play";
        play.innerHTML = '<i class="fa-solid fa-play"></i>';
        play.onclick = function () { playAudio(item.audio); };
        const body = document.createElement("div");
        body.className = "survival-body";
        const r = document.createElement("b");
        r.textContent = item.romaji;
        const tr = document.createElement("span");
        tr.className = "survival-tr";
        tr.textContent = item.tr[lang];
        const jp = document.createElement("div");
        jp.className = "survival-jp";
        jp.textContent = item.jp;
        jp.style.display = "none";
        const toggle = document.createElement("button");
        toggle.className = "show-jp-btn";
        toggle.textContent = t("showJp");
        toggle.onclick = function () {
            const open = jp.style.display !== "none";
            jp.style.display = open ? "none" : "block";
            toggle.textContent = open ? t("showJp") : t("hideJp");
        };
        body.appendChild(r);
        body.appendChild(tr);
        body.appendChild(jp);
        body.appendChild(toggle);
        row.appendChild(play);
        row.appendChild(body);
        list.appendChild(row);
    });
}

function backToMenu() {
    try { player.pause(); } catch (e) {}
    renderMenu();
}

// 初期化
el("next-btn").onclick = nextScene;
el("pq-back").onclick = backToMenu;
el("btn-to-menu").onclick = backToMenu;
el("btn-replay").onclick = function () { startQuest(cur); };
el("speed-10").onclick = function () { setSpeed(1.0); };
el("speed-08").onclick = function () { setSpeed(0.8); };
buildLangSwitcher();
applyTexts();
renderMenu();
</script>

</body>
</html>
